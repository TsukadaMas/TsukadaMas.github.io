name: Deploy Website V2 to GitHub Pages

on:
  push:
    branches: [page-v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: personalwebsite/Website V2/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: personalwebsite/Website V2
        run: npm ci
      - name: Check and build
        working-directory: personalwebsite/Website V2
        run: |
          npm run typecheck
          npm run build
          cp build/client/index.html build/client/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: personalwebsite/Website V2/build/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
